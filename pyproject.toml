[project]
name = "sim7200"
version = "0.1.0"
description = "Scoped Siemens S7-200 SMART AWL (STL) simulator with a Modbus TCP slave and web GUI"
requires-python = ">=3.11"
dependencies = [
    "pymodbus==3.9.2",
    "nicegui>=2.0",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim7200"]
